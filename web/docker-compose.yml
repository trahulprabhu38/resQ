version: '3'

services:
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/resq-db
      - JWT_SECRET=your-secret-key-here
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173
      - STREAMLIT_URL=http://streamlit:8501
    depends_on:
      - mongo
      - streamlit
    networks:
      - resq-network

  client:
    build:
      context: ./client
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - resq-network

  streamlit:
    build:
      context: ./client/BLOOD_REPORT
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    networks:
      - resq-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - resq-network

networks:
  resq-network:
    driver: bridge

volumes:
  mongo-data:

